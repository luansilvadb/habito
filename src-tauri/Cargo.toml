[package]
name = "pratica-deliberada"
version = "0.1.0"
edition = "2021"
description = "Sistema de indução comportamental para prática focada em jogos competitivos"
authors = ["Habito"]
license = "Apache-2.0"

[lib]
name = "pratica_deliberada_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
